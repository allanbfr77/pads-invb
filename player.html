<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pads Igreja — Player</title>
<style>
  :root { --bg:#0e1116; --card:#171b23; --fg:#e8ecf2; --mut:#8a94a6; --acc:#7c9cff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#ffb454; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; padding:20px; display:flex; justify-content:center; }
  main { width:100%; max-width:600px; }
  h1 { font-size:16px; font-weight:600; color:var(--mut); margin:0 0 14px; letter-spacing:.05em; text-transform:uppercase; }
  .card { background:var(--card); border-radius:16px; padding:20px; margin-bottom:14px; }
  .big { font-size:88px; font-weight:700; text-align:center; line-height:1; min-height:88px; }
  .sub { text-align:center; color:var(--mut); margin-top:8px; font-size:14px; }
  button, select { font:inherit; color:var(--fg); background:#232938; border:1px solid #2f374a; border-radius:10px; padding:11px 14px; width:100%; cursor:pointer; }
  button.primary { background:var(--acc); color:#0b1020; border:0; font-weight:700; font-size:18px; padding:16px; }
  label { display:block; color:var(--mut); font-size:13px; margin:0 0 6px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  .row > * { width:auto; flex:1; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .dot.on { background:var(--ok); }
  .meter { height:8px; background:#232938; border-radius:4px; overflow:hidden; margin-top:16px; }
  .meter > i { display:block; height:100%; width:0; background:var(--acc); transition:width .08s; }
  .small { font-size:13px; color:var(--mut); }
  .conn { display:flex; gap:16px; align-items:center; }
  .conn img { width:132px; height:132px; background:#fff; border-radius:10px; padding:4px; }
  .conn a { color:var(--acc); word-break:break-all; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Pads Igreja · Player</h1>

  <div class="card" id="startCard">
    <button class="primary" id="startBtn">Iniciar áudio</button>
    <div class="sub">Clique uma vez para liberar o som neste navegador.</div>
  </div>

  <div class="card">
    <div class="big" id="keyName">—</div>
    <div class="sub" id="info">Aguardando</div>
    <div class="sub" id="loadMsg"></div>
    <div class="meter"><i id="meter"></i></div>
  </div>

  <div class="card">
    <label for="device">Saída de áudio (placa ou mesa de som)</label>
    <div class="row"><select id="device"><option value="">Padrão do sistema</option></select></div>
    <div class="row">
      <button id="refresh">Listar saídas</button>
      <button id="test">Testar saída</button>
      <button id="rescan">Recarregar samples</button>
    </div>
    <div class="small" id="devMsg"></div>
  </div>

  <div class="card conn">
    <img id="qr" alt="QR Code do controle" class="hidden">
    <div>
      <div><span class="dot" id="dot"></span><span id="conn">Conectando…</span></div>
      <div class="small" id="remotes" style="margin:6px 0"></div>
      <div class="small">Controle no celular:</div>
      <div id="urls" class="small"></div>
    </div>
  </div>
</main>

<script src="/engine.js"></script>
<script>
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const $ = (id) => document.getElementById(id);
const AUTO = new URLSearchParams(location.search).has('auto');
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch {} };

let snap = null;       // última mensagem de estado do servidor
let meterOn = false;
const eng = createEngine({
  getSnap: () => snap,
  onMsg: (t) => { $('loadMsg').textContent = t; },
  onSuspend: () => $('startCard').classList.remove('hidden'),
});

function render() {
  const s = snap.state;
  const on = s.playing && s.key !== null;
  $('keyName').textContent = on ? NAMES[s.key] + (s.mode === 'min' ? 'm' : '') : (s.key !== null ? '·' : '—');
  const lbl = (id) => (snap.timbres.find((x) => x.id === id) || {}).label || id;
  const pads = s.layers.filter((l) => l.timbre).map((l) => lbl(l.timbre)).join(' + ');
  const tun = s.tuning ? ` · ${s.tuning > 0 ? '+' : ''}${s.tuning}c` : '';
  $('info').textContent = on ? `${pads} · volume ${Math.round(s.volume * 100)}%${tun}` : (eng.started ? 'Silêncio' : 'Aguardando');
  $('remotes').textContent = `${snap.remotes} controle(s) conectado(s)`;
}

// ============================================================ áudio
async function startAudio() {
  const started = await eng.start(lsGet('padsDevice'));
  $('startCard').classList.toggle('hidden', started);
  if (!started) return;
  if (!meterOn) { meterOn = true; drawMeter(); try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch {} }
  if (snap) render();
}

function drawMeter() {
  const analyser = eng.analyser, buf = new Uint8Array(analyser.fftSize);
  (function loop() {
    analyser.getByteTimeDomainData(buf);
    let peak = 0;
    for (const v of buf) peak = Math.max(peak, Math.abs(v - 128) / 128);
    $('meter').style.width = Math.min(100, peak * 160) + '%';
    requestAnimationFrame(loop);
  })();
}

// ============================================================ dispositivos de saída
async function listDevices() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true }); // necessário para o navegador mostrar os nomes
    s.getTracks().forEach((t) => t.stop());
  } catch { $('devMsg').textContent = 'Sem permissão de microfone: os nomes das saídas podem aparecer genéricos.'; }
  let devs = [];
  try { devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audiooutput'); } catch {}
  const sel = $('device'), saved = lsGet('padsDevice') || '';
  sel.innerHTML = '<option value="">Padrão do sistema</option>';
  devs.forEach((d) => {
    const o = document.createElement('option');
    o.value = d.deviceId; o.textContent = d.label || 'Saída ' + d.deviceId.slice(0, 6);
    if (d.deviceId === saved) o.selected = true;
    sel.appendChild(o);
  });
}
$('refresh').onclick = listDevices;
$('device').onchange = async (e) => {
  lsSet('padsDevice', e.target.value);
  if (!eng.ctx) { $('devMsg').textContent = 'Clique em "Iniciar áudio" para aplicar.'; return; }
  try { await eng.ctx.setSinkId(e.target.value || ''); $('devMsg').textContent = 'Saída alterada.'; }
  catch (err) { $('devMsg').textContent = 'Não foi possível trocar a saída: ' + err.message; }
};
$('test').onclick = async () => {
  await startAudio();
  const ctx = eng.ctx;
  if (!ctx || !eng.started) return;
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
  o.frequency.value = 261.63; g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.15, t + 0.05); g.gain.linearRampToValueAtTime(0, t + 1.2);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 1.3);
  $('devMsg').textContent = 'Tom de teste enviado para a saída selecionada.';
};
$('rescan').onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'rescan' })); $('devMsg').textContent = 'Procurando samples na pasta…'; };
$('startBtn').onclick = startAudio;
listDevices();

// ============================================================ QR e endereços
(async function info() {
  try {
    const pin = lsGet('padsPin');
    const r = await fetch('/api/info', { headers: pin ? { 'X-Pin': pin } : {} });
    const j = await r.json();
    if (!j.ok) return;
    $('urls').innerHTML = j.urls.map((u) => `<div><a href="${u}" target="_blank" rel="noopener">${u}</a></div>`).join('') || 'Sem rede detectada';
    if (j.qr && j.urls[0]) { const img = $('qr'); img.src = '/qr.svg?url=' + encodeURIComponent(j.urls[0]); img.classList.remove('hidden'); }
  } catch {}
})();

// ============================================================ WebSocket
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => {
    const pin = lsGet('padsPin');
    if (pin) ws.send(JSON.stringify({ type: 'auth', pin }));
    ws.send(JSON.stringify({ type: 'hello', role: 'player' }));
    $('dot').classList.add('on'); $('conn').textContent = 'Conectado ao servidor';
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'hello_ack' && !m.authed && !lsGet('padsPin')) {
      const p = prompt('PIN do servidor:') || '';
      if (p) { lsSet('padsPin', p); ws.send(JSON.stringify({ type: 'auth', pin: p })); ws.send(JSON.stringify({ type: 'hello', role: 'player' })); }
    } else if (m.type === 'auth' && !m.ok) {
      lsDel('padsPin'); $('conn').textContent = m.blocked ? 'Muitas tentativas de PIN. Aguarde 1 min.' : 'PIN incorreto. Recarregue a página.';
    } else if (m.type === 'auth' && m.ok) {
      ws.send(JSON.stringify({ type: 'hello', role: 'player' }));
    } else if (m.type === 'state') {
      snap = m; render(); eng.apply();
    }
  };
  ws.onclose = () => { $('dot').classList.remove('on'); $('conn').textContent = 'Reconectando…'; setTimeout(connect, 1500); };
  ws.onerror = () => { try { ws.close(); } catch {} };
}
connect();

if (AUTO) startAudio();
</script>
</body>
</html>
